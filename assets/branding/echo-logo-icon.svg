<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1F1528" />
      <stop offset="60%" stop-color="#0E0B14" />
      <stop offset="100%" stop-color="#060509" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.6" />
    </linearGradient>

    <!-- Echo Soundwave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#00B4D8" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>

    <!-- Core Play Emitter Gradient -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFF0F5" />
      <stop offset="60%" stop-color="#FF1493" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.6" />

  <!-- Ambient Glow Behind Waves -->
  <circle cx="256" cy="256" r="130" fill="#FF0055" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="80" fill="#7928CA" opacity="0.22" filter="url(#softGlow)" />

  <!-- Outer Echo Soundwave Arc (Wave 3) -->
  <path d="M 120 256 A 136 136 0 1 1 392 256 A 136 136 0 0 1 120 256"
        fill="none"
        stroke="url(#waveGrad3)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-dasharray="320 180"
        opacity="0.5" />

  <!-- Mid Echo Soundwave Arc (Wave 2) -->
  <path d="M 160 256 A 96 96 0 1 1 352 256 A 96 96 0 0 1 160 256"
        fill="none"
        stroke="url(#waveGrad2)"
        stroke-width="15"
        stroke-linecap="round"
        stroke-dasharray="240 120"
        opacity="0.8" />

  <!-- Inner Dynamic Echo Wave (Wave 1) -->
  <path d="M 196 256 A 60 60 0 1 1 316 256 A 60 60 0 0 1 196 256"
        fill="none"
        stroke="url(#waveGrad1)"
        stroke-width="18"
        stroke-linecap="round"
        stroke-dasharray="160 60"
        filter="url(#coreGlow)" />

  <!-- Central Sonic Core: Playhead / Audio Frequency Pulse -->
  <g transform="translate(242, 234)">
    <!-- Shadow Play Icon -->
    <path d="M -6 -16 L 38 12 L -6 40 Z" fill="#FF0055" opacity="0.4" filter="url(#coreGlow)" />
    <!-- Main Playhead Shape -->
    <path d="M -4 -14 C -4 -16.5 -1.2 -18 1.0 -16.5 L 34.5 6.0 C 36.8 7.5 36.8 11.0 34.5 12.5 L 1.0 35.0 C -1.2 36.5 -4 35.0 -4 32.5 Z"
          fill="url(#playGrad)" />
  </g>

  <!-- Acoustic Pulse Dots (Dynamic Sound Equalizer accents) -->
  <circle cx="390" cy="210" r="5" fill="#00F5D4" opacity="0.8" />
  <circle cx="122" cy="302" r="6" fill="#FF0055" opacity="0.7" />
  <circle cx="355" cy="335" r="4.5" fill="#FFB800" opacity="0.85" />
</svg>
